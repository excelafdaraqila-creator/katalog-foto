<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VD FOTOGRAFI</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#ffffff;
}
header{
  padding:16px;
  border-bottom:1px solid #eee;
}
header h2{
  margin:0;
}
header p{
  margin:5px 0 0;
  color:#666;
  font-size:14px;
}

.container{
  padding:10px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  border-radius:6px;
  overflow:hidden;
  border:1px solid #eee;
}

.img-box{
  position:relative;
}
.img-box img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.label{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(160,0,0,0.8);
  color:white;
  padding:8px;
  font-weight:bold;
  text-align:center;
}

.info{
  padding:10px;
}
.info h4{
  margin:0;
  font-size:14px;
}
.info p{
  margin:6px 0 0;
  color:#555;
  font-size:13px;
}

.card a{
  text-decoration:none;
  color:inherit;
}
</style>
</head>

<body>

<header>
  <h2>Paket Foto</h2>
  <p>Pilih paket foto sesuai kebutuhan Anda</p>
</header>

<div class="container">

<!-- FAMILY -->
<div class="card">
<a href="https://wa.me/6285624718366?text=Saya%20ingin%20booking%20Family%20Portrait">
  <div class="img-box">
    <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf">
    <div class="label">FAMILY PORTRAIT</div>
  </div>
  <div class="info">
    <h4>Family Portrait</h4>
    <p>Dari Rp 40.000</p>
  </div>
</a>
</div>

<!-- GROUP -->
<div class="card">
<a href="https://wa.me/6285624718366?text=Saya%20ingin%20booking%20Foto%20Group">
  <div class="img-box">
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
    <div class="label">GROUP</div>
  </div>
  <div class="info">
    <h4>Foto Group</h4>
    <p>Dari Rp 70.000</p>
  </div>
</a>
</div>

<!-- WISUDA -->
<div class="card">
<a href="https://wa.me/6285624718366?text=Saya%20ingin%20booking%20Foto%20Wisuda">
  <div class="img-box">
    <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1">
    <div class="label">GRADUATION</div>
  </div>
  <div class="info">
    <h4>Foto Wisuda</h4>
    <p>Dari Rp 60.000</p>
  </div>
</a>
</div>

<!-- SELF FOTO -->
<div class="card">
<a href="https://wa.me/6285624718366?text=Saya%20ingin%20booking%20Foto%20Selffoto">
  <div class="img-box">
    <img src="https://images.unsplash.com/photo-1542060748-10c28b62716e">
    <div class="label">SELF FOTO</div>
  </div>
  <div class="info">
    <h4>SELF FOTO</h4>
    <p>Dari Rp 25.000/Orang Waktu 15 Menit</p>
  </div>
</a>
</div>

</div>

</body>
</html>
